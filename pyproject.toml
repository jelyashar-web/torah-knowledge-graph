[project]
name = "torah-knowledge-graph"
version = "0.1.0"
description = "Graph-native knowledge platform for Torah literature"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "neo4j>=5.20",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100

[tool.pyright]
strict = ["scripts"]
