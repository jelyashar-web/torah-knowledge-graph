name: CI / CD — Torah Knowledge Graph

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Backend Tests ─────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PLUGINS: '["apoc", "gds"]'
        ports:
          - 7687:7687
          - 7474:7474
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tkg
          POSTGRES_PASSWORD: tkg-test
          POSTGRES_DB: torah_graph
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.10
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-extras

      - name: Run tests
        run: |
          cd backend
          uv run pytest --cov=app --cov-report=xml -xvs
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          DATABASE_URL: postgresql+asyncpg://tkg:tkg-test@localhost:5432/torah_graph
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml

      - name: Security scan (Bandit)
        run: |
          cd backend
          uv run bandit -r app -f json -o bandit-report.json || true

  # ── Frontend Tests ────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npm run type-check || npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npm run lint || npx next lint

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=moderate || true

  # ── Docker Build ──────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (Staging) ──────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # kubectl set image deployment/tkg-backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          # kubectl set image deployment/tkg-frontend frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
