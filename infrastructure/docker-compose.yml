version: "3.9"

services:
  # ───────────────────────────────────────────
  # Graph Database
  # ───────────────────────────────────────────
  neo4j:
    image: neo4j:5.23-community
    container_name: tkg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-torah-graph-secure}
      - NEO4J_PLUGINS=["apoc", "gds"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-torah-graph-secure}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Relational Database
  # ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tkg-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tkg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tkg-postgres-secure}
      - POSTGRES_DB=${POSTGRES_DB:-torah_knowledge_graph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tkg} -d ${POSTGRES_DB:-torah_knowledge_graph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Vector Database
  # ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: tkg-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Message Broker / Cache
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tkg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Backend API
  # ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tkg-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-torah-graph-secure}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tkg}:${POSTGRES_PASSWORD:-tkg-postgres-secure}@postgres:5432/${POSTGRES_DB:-torah_knowledge_graph}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - MAX_CYPHER_QUERY_TIMEOUT_MS=5000
      - MAX_GRAPH_NODES_RETURN=1000
      - AI_MODEL_DEFAULT=claude-sonnet-4-6
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app:ro
      - backend_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Celery Worker
  # ───────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tkg-worker
    restart: unless-stopped
    command: celery -A app.celery worker -l info -Q etl,extraction,embedding,default
    environment:
      - ENVIRONMENT=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-torah-graph-secure}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tkg}:${POSTGRES_PASSWORD:-tkg-postgres-secure}@postgres:5432/${POSTGRES_DB:-torah_knowledge_graph}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - AI_MODEL_DEFAULT=claude-sonnet-4-6
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app:ro
      - worker_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Celery Beat (Scheduler)
  # ───────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tkg-beat
    restart: unless-stopped
    command: celery -A app.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tkg}:${POSTGRES_PASSWORD:-tkg-postgres-secure}@postgres:5432/${POSTGRES_DB:-torah_knowledge_graph}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tkg-network

  # ───────────────────────────────────────────
  # Frontend
  # ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: tkg-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/v1/ws
      - NEXT_PUBLIC_ENVIRONMENT=development
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tkg-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  worker_logs:
    driver: local

networks:
  tkg-network:
    driver: bridge
    name: torah-knowledge-graph
